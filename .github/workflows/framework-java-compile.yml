name: Framework Java Compile

on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: ${{ matrix.distribution || 'temurin' }}
        cache: maven
    - name: Build with Maven
      shell: bash
      run: mvn clean install "-Dplugin.http-server.netty.display-error=true"
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
